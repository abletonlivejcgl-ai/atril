name: Build LevelMatch (macOS)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S levelmatch -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign (ad-hoc) and zip
        run: |
          mkdir out
          cp -R build/LevelMatch_artefacts/Release/VST3/*.vst3 out/
          cp -R build/LevelMatch_artefacts/Release/AU/*.component out/
          for p in out/*; do codesign --force --deep -s - "$p"; done
          cd out && zip -r ../LevelMatch-macOS.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: LevelMatch-macOS
          path: LevelMatch-macOS.zip
      - name: Publish release
        run: gh release create levelmatch-${{ github.run_number }} LevelMatch-macOS.zip --title "Level Match build ${{ github.run_number }}" --notes "VST3 y AU para macOS" --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
